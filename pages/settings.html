<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../css/style.css"><title>Settings</title></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="../index.html">← Attendance</a></div></nav><main class="container py-4"><h1 class="h4 page-title">Work Settings</h1><div id="alertBox"></div><form id="settingsForm" class="panel mt-3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Shift Start</label><input id="shiftStart" type="time" class="form-control"></div><div class="col-md-6"><label class="form-label">Shift End</label><input id="shiftEnd" type="time" class="form-control"></div><div class="col-md-6"><label class="form-label">Grace Period (minutes)</label><input id="graceMinutes" type="number" min="0" class="form-control"></div><div class="col-md-6"><label class="form-label">Break (minutes)</label><input id="breakMinutes" type="number" min="0" class="form-control"></div><div class="col-12"><div class="form-check"><input id="lateEnabled" class="form-check-input" type="checkbox"><label class="form-check-label">Calculate late coming</label></div><div class="form-check"><input id="earlyOutEnabled" class="form-check-input" type="checkbox"><label class="form-check-label">Calculate early out</label></div><div class="form-check"><input id="overtimeEnabled" class="form-check-input" type="checkbox"><label class="form-check-label">Calculate overtime</label></div></div><div class="col-12"><button class="btn btn-dark">Save Settings</button></div></div></form></main>
<script src="../js/database.js"></script><script src="../js/app.js"></script><script src="../js/settings.js"></script><script>loadSettingsPage();</script></body></html>
