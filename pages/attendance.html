<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Attendance</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container"><a class="navbar-brand" href="../index.html">← Attendance</a></div>
    </nav>
    <main class="container py-4">
        <h1 class="h4 page-title">Mark Attendance</h1>
        <div id="alertBox"></div>
        <div class="panel my-3"><label class="form-label">Employee</label><select id="employeeSelect"
                class="form-select mb-2"></select>
            <div id="shiftInfo" class="small text-muted mb-3"></div>
            <div class="row g-2">
                <div class="col-6"><button id="markBtn" class="btn btn-dark btn-lg w-100">Check In</button></div>
                <div class="col-6"><button id="checkoutBtn" class="btn btn-outline-dark btn-lg w-100">Check Out</button>
                </div>
            </div>
        </div>
        <div class="panel table-responsive">
            <h2 class="h5">Today's Records</h2>
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>In</th>
                        <th>Out</th>
                        <th>Work</th>
                        <th>Late</th>
                        <th>Early</th>
                        <th>OT</th>
                    </tr>
                </thead>
                <tbody id="attendanceBody"></tbody>
            </table>
        </div>
    </main>
    <script src="../js/database.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/attendance.js"></script>
    <script>loadAttendancePage();</script>
</body>

</html>
